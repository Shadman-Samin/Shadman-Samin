<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3fb950;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" rx="12" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Title bar dots -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27c93f"/>

  <!-- Title bar text -->
  <text x="450" y="23" font-family="monospace" font-size="11" fill="#8b949e" text-anchor="middle">shadman@github — ~/profile</text>

  <!-- Top separator -->
  <line x1="0" y1="35" x2="900" y2="35" stroke="#30363d" stroke-width="1"/>

  <!-- Line 1: prompt -->
  <text x="24" y="65" font-family="monospace" font-size="15" fill="#58a6ff">┌─[</text>
  <text x="57" y="65" font-family="monospace" font-size="15" fill="#3fb950">shadman</text>
  <text x="134" y="65" font-family="monospace" font-size="15" fill="#58a6ff">@</text>
  <text x="145" y="65" font-family="monospace" font-size="15" fill="#3fb950">github</text>
  <text x="199" y="65" font-family="monospace" font-size="15" fill="#58a6ff">]─[~/profile]</text>

  <!-- Line 2: ascii art line -->
  <text x="24" y="95" font-family="monospace" font-size="15" fill="#58a6ff">│</text>
  <text x="38" y="95" font-family="monospace" font-size="15" fill="#c9d1d9" font-weight="bold">SHADMAN SAMIN</text>
  <text x="244" y="95" font-family="monospace" font-size="15" fill="#58a6ff">│</text>

  <!-- Line 3: tagline -->
  <text x="24" y="120" font-family="monospace" font-size="15" fill="#58a6ff">│</text>
  <text x="38" y="120" font-family="monospace" font-size="14" fill="#8b949e">developer · designer · builder of digital things</text>
  <text x="448" y="120" font-family="monospace" font-size="15" fill="#58a6ff">│</text>

  <!-- Line 4: status -->
  <text x="24" y="145" font-family="monospace" font-size="15" fill="#58a6ff">│</text>
  <text x="38" y="145" font-family="monospace" font-size="13" fill="#8b949e">STATUS:</text>
  <text x="91" y="145" font-family="monospace" font-size="13" fill="#27c93f">ACTIVE</text>
  <text x="144" y="145" font-family="monospace" font-size="13" fill="#8b949e">BUILD:</text>
  <text x="196" y="145" font-family="monospace" font-size="13" fill="#d2a8ff">RELEASE</text>
  <text x="268" y="145" font-family="monospace" font-size="13" fill="#8b949e">SHIPPED:</text>
  <text x="330" y="145" font-family="monospace" font-size="13" fill="#ffa657">15+</text>
  <text x="365" y="145" font-family="monospace" font-size="15" fill="#58a6ff">│</text>

  <!-- Line 5: bottom border -->
  <text x="24" y="170" font-family="monospace" font-size="15" fill="#58a6ff">└─────────────────────────────────────────────────────────────────┘</text>

  <!-- Bottom line -->
  <line x1="0" y1="205" x2="900" y2="205" stroke="#30363d" stroke-width="0.5"/>
</svg>
